<!-- src/app/home/home.component.html -->
<div class="container">
  <h1>UPC Barcode Generator</h1>
  
  <!-- File input to capture/select an image -->
  <input type="file" accept="image/*" (change)="onFileSelected($event)" capture="environment">
  
  <!-- Status/message area -->
  <div *ngIf="processing">{{ message }}</div>
  
  <!-- If UPCs are detected, display them -->
  <div *ngIf="!processing && upcList.length > 0">
    <h2>Detected UPCs:</h2>
    <div *ngFor="let upc of upcList; let i = index" class="upc-item" style="margin-bottom: 30px;">
      <p><strong>UPC:</strong> {{ upc }}</p>
      
      <!-- This SVG will be filled in by JsBarcode -->
      <svg [attr.id]="'barcode' + i"></svg>
      
      <!-- If a product image is available from the API, display it -->
      <div *ngIf="productImages[upc]">
         <p><strong>Product Image:</strong></p>
         <img [src]="productImages[upc]" alt="Product Image" style="max-width:200px;">
      </div>
    </div>
  </div>
  
  <!-- If no UPCs were found, notify the user -->
  <div *ngIf="!processing && upcList.length === 0 && ocrText">
    <p>No UPC codes found in the image.</p>
  </div>
</div>
